<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login">
    <div class="panel">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✈</span><span>Flight Tracker</span></div>
      <p class="muted">Log in to see your tracked flights.</p>
      <form method="post" action="/login">
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">Log in</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </div>
  </main>
  <script>
    const reason = new URLSearchParams(location.search).get("error");
    const messages = {
      wrong: "Wrong password. Try again.",
      wait: "Too many wrong tries. Please wait 15 minutes.",
    };
    document.getElementById("error").textContent = messages[reason] || "";
  </script>
</body>
</html>
